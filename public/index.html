<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Booking Appointment App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header class="hero">
      <span class="badge">Appointments</span>
      <h1>Book an appointment</h1>
      <p>Fill in your details and we'll reserve a slot for you.</p>
    </header>

    <div class="layout">
      <section class="card">
        <h2>Your details</h2>
        <form id="booking-form" novalidate>
          <label for="name">Name</label>
          <input type="text" id="name" name="name" placeholder="e.g. Prasad Kumar" autocomplete="name" required>

          <label for="phonenumber">Phone number</label>
          <input type="tel" id="phonenumber" name="phonenumber" placeholder="e.g. 9876543210" autocomplete="tel" pattern="[0-9+\-\s]{7,15}" required>

          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="e.g. prasad@example.com" autocomplete="email" required>

          <p id="form-error" class="form-error" role="alert"></p>
          <button type="submit" id="submit-btn">Book appointment</button>
        </form>
      </section>

      <section class="card">
        <div class="list-header">
          <h2>Booked appointments</h2>
          <span id="count" class="count">0</span>
        </div>
        <ul id="user-list" class="user-list"></ul>
        <p id="empty" class="empty">No appointments yet. Your bookings will show up here.</p>
      </section>
    </div>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
